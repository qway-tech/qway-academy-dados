name: Content Plane v2

on:
  pull_request:
    paths:
      - "content/**"
      - "taxonomy/**"
      - "schemas/**"
      - "generated/**"
      - "tooling/**"
      - ".github/workflows/content-plane-v2.yml"

  push:
    paths:
      - "content/**"
      - "taxonomy/**"
      - "schemas/**"
      - "generated/**"
      - "tooling/**"
      - ".github/workflows/content-plane-v2.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-plane-check:
    name: Content Plane Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling/validate/requirements.txt

      - name: Install Content Plane dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tooling/validate/requirements.txt

      - name: Run validator tests
        run: |
          python -m unittest discover \
            -s tooling/validate/tests \
            -p 'test_*.py'

      - name: Run catalog builder tests
        run: |
          python -m unittest discover \
            -s tooling/build/tests \
            -p 'test_*.py'

      - name: Validate Content Plane and generated catalogs
        run: |
          python tooling/content.py check
